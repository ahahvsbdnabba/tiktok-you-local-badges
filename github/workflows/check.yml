
name: Check Add-on Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f README.md
          test -f addon-notes.md
          echo "Project files found."
          echo "Ready for add-on format investigation."
